<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syntax Solver LIVE 24/7</title>
<style>
  /* ====== CONFIG: only change in the script below (VIDEO_ID, CHANNEL_TITLE) ====== */
  :root{--red:#ff1744;--neon:#00e5ff;--bg:#05060d}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:#fff;font-family:Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
  body::before{content:"";position:fixed;inset:-50%;background:
    radial-gradient(circle at 20% 30%,rgba(255,23,68,.25),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(0,229,255,.22),transparent 40%);
    animation:spin 25s linear infinite;z-index:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:14px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
  .live{display:flex;align-items:center;gap:8px;background:var(--red);padding:6px 14px;border-radius:30px;font-weight:800;letter-spacing:2px;box-shadow:0 0 20px var(--red)}
  .dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.5)}}
  .viewers{opacity:.9;font-size:15px}
  h1{font-size:clamp(18px,3vw,30px);text-shadow:0 0 18px var(--neon)}
  .frame{position:relative;width:min(96vw,calc((100vh - 150px)*16/9));aspect-ratio:16/9;border-radius:16px;overflow:hidden;
    box-shadow:0 0 0 2px rgba(0,229,255,.6),0 0 40px rgba(0,229,255,.45),0 0 90px rgba(255,23,68,.35)}
  #player,#player iframe{position:absolute;inset:0;width:100%;height:100%}
  .shield{position:absolute;inset:0;z-index:5}           /* blocks click/pause/seek => feels live */
  .join{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(circle,rgba(5,6,13,.75),rgba(5,6,13,.97));cursor:pointer;transition:opacity .6s}
  .join.hide{opacity:0;pointer-events:none}
  .btn{padding:16px 40px;font-size:22px;font-weight:800;letter-spacing:3px;border:0;border-radius:50px;color:#fff;cursor:pointer;
    background:linear-gradient(90deg,var(--red),#ff6d00);box-shadow:0 0 30px var(--red);animation:glow 1.6s infinite}
  @keyframes glow{50%{box-shadow:0 0 60px var(--red);transform:scale(1.06)}}
  .sub{opacity:.75;font-size:14px}
  .foot{font-size:13px;opacity:.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="live"><span class="dot"></span>LIVE</div>
    <h1 id="title"></h1>
    <div class="viewers">👁 <span id="vc">0</span> watching</div>
  </div>

  <div class="frame">
    <div id="player"></div>
    <div class="shield"></div>
    <div class="join" id="join">
      <button class="btn">▶ JOIN LIVE</button>
      <div class="sub">Streaming 24/7 • Tap to enter with sound</div>
    </div>
  </div>
  <div class="foot">🔴 Always live • Powered by Syntax Solver</div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ============ CHANGE THESE ============ */
const VIDEO_ID      = "PASTE_YOUR_VIDEO_ID";   // youtube.com/watch?v=THIS_PART
const CHANNEL_TITLE = "Syntax Solver LIVE 24/7";
/* ======================================= */

document.getElementById("title").textContent = CHANNEL_TITLE;
let player, duration = 0, started = false;

function expectedPos(){ return duration ? (Date.now()/1000) % duration : 0; }

function onYouTubeIframeAPIReady(){
  player = new YT.Player("player",{
    videoId: VIDEO_ID,
    playerVars:{controls:0,disablekb:1,modestbranding:1,rel:0,playsinline:1,fs:0,iv_load_policy:3,loop:1,playlist:VIDEO_ID},
    events:{
      onReady:()=>{ duration = player.getDuration(); },
      onStateChange:e=>{
        if(!started) return;
        if(e.data===YT.PlayerState.ENDED || e.data===YT.PlayerState.PAUSED){ goLive(); }
      }
    }
  });
}

function goLive(){
  duration = player.getDuration() || duration;
  if(!duration) return;
  player.seekTo(expectedPos(), true);
  player.playVideo();
}

document.getElementById("join").addEventListener("click",()=>{
  if(!player || !player.getDuration) return;
  started = true;
  player.unMute(); player.setVolume(100);
  goLive();
  document.getElementById("join").classList.add("hide");
});

// drift correction: keep everyone in sync with the "live" clock
setInterval(()=>{
  if(!started || !duration) return;
  const cur = player.getCurrentTime(), exp = expectedPos();
  let diff = Math.abs(cur-exp); diff = Math.min(diff, duration-diff);
  if(diff > 4) player.seekTo(exp,true);
  if(player.getPlayerState()!==YT.PlayerState.PLAYING && player.getPlayerState()!==YT.PlayerState.BUFFERING) player.playVideo();
}, 15000);

// resume when tab becomes visible again
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && started) goLive(); });

// viewer counter (cosmetic, gently fluctuates)
let vc = 120 + Math.floor(Math.random()*180);
const vcEl = document.getElementById("vc");
setInterval(()=>{ vc = Math.max(40, vc + Math.floor(Math.random()*9)-4); vcEl.textContent = vc.toLocaleString(); }, 3000);
vcEl.textContent = vc;
</script>
</body>
</html>
